name: Container image
on:
  workflow_dispatch:
  push:
    branches: [staging/real-v16]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the pinned ERPNext v16 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: ERPNEXT_VERSION=v16.34.2
          push: true
          tags: |
            ghcr.io/greatwharf/frappe-intelligence:0.2.0
            ghcr.io/greatwharf/frappe-intelligence:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
